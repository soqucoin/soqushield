# gitleaks configuration for the checks workflow: the default rules, plus one reviewed allowance.
[extend]
useDefault = true

# CocoaPods records a SHA-1 checksum per pod in Podfile.lock, and the generic-api-key rule matches
# them. The allowance takes only a checksum-shaped line in that one file: both conditions must hold.
[[allowlists]]
description = "Podfile.lock checksum lines (reviewed 4 November 2026)"
condition = "AND"
paths = ['''^ios/Podfile\.lock$''']
regexTarget = "line"
regexes = ['''^\s*[A-Za-z0-9_./+-]+: [0-9a-f]{40}\s*$''']
