# gitleaks configuration for the checks workflow: the default rules, plus one reviewed allowance.
[extend]
useDefault = true

# CocoaPods records a SHA-1 checksum per pod in Podfile.lock, and the generic-api-key rule matches
# them. The allowance takes only a checksum-shaped line in that one file: both conditions must hold.
[[allowlists]]
description = "Podfile.lock checksum lines (reviewed 4 November 2026)"
condition = "AND"
paths = ['''^ios/Podfile\.lock$''']
regexTarget = "line"
regexes = ['''^\s*[A-Za-z0-9_./+-]+: [0-9a-f]{40}\s*$''']

# The app names every stored value with a key of the form `soq..._v<n>` — lowercase, versioned,
# and present in the source because it IS the name the value is stored under. The generic-api-key
# rule scores `soq_fiat_currency_v1` at entropy 3.88 and reports it as a secret.
#
# The allowance is written against the VALUE's shape rather than the variable's name: a key that
# is actually secret cannot look like this. Lowercase letters, digits and underscores only,
# opening `soq`, closing `_v` and digits, and the line must assign exactly that literal and end
# there. Both conditions must hold, and only under lib/.
[[allowlists]]
description = "Storage key names in the app source (reviewed 5 November 2026)"
condition = "AND"
paths = ['''^lib/.*\.dart$''']
regexTarget = "line"
regexes = ['''=\s*'soq[a-z0-9_]*_v[0-9]+'\s*;\s*$''']
